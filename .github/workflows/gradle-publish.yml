name: Deploy Spring Boot App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Upload Spring Boot project to server
      env:
        SSH_HOST: ${{ secrets.SSH_HOST }}
        SSH_USER: ${{ secrets.SSH_USER }}
        SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
      run: |
        sshpass -p "$SSH_PASSWORD" ssh -t -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST << EOF
          echo "$SSH_PASSWORD" | mkdir -p ~/springboot-app
        EOF
        sshpass -p "$SSH_PASSWORD" scp -o StrictHostKeyChecking=no -r ./* $SSH_USER@$SSH_HOST:~/springboot-app/

    - name: Build and run Spring Boot project on server
      env:
        SSH_HOST: ${{ secrets.SSH_HOST }}
        SSH_USER: ${{ secrets.SSH_USER }}
        SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
      run: |
        sshpass -p "$SSH_PASSWORD" ssh -t -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST << EOF
          cd ~/springboot-app
          chmod +x ./gradlew  # Gradle Wrapper에 실행 권한 부여
          ./gradlew clean build || { echo "Gradle build failed"; exit 1; }
          nohup java -jar build/libs/*.jar --server.port=8080 > app.log 2>&1 &
        EOF
